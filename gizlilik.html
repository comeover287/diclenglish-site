  :root{
    --bg:#0A0918;
    --panel:#12112A;
    --line-dark:#1E1C3A;
    --purple-deep:#3D3A8C;
    --purple:#6663B8;
    --purple-light:#9896D4;
    --text:#EEEDF8;
    --maxw:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Epilogue',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}

  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(900px 500px at 12% -5%, rgba(102,99,184,0.14), transparent 60%),
      radial-gradient(700px 500px at 100% 100%, rgba(61,58,140,0.10), transparent 55%);
    pointer-events:none;z-index:0;
  }
  .container{max-width:var(--maxw);margin:0 auto;padding:0 28px;position:relative;z-index:1}

  .icon{display:inline-block;vertical-align:middle}

  header.nav{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(14px);

    border-bottom:1px solid var(--line-dark);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:74px}

  .brand .wm b{font-weight:800;font-size:24px;letter-spacing:-1px}
  .brand .wm span{font-weight:300;font-size:9px;letter-spacing:6px;color:var(--purple);margin-top:3px}
  nav.links{display:flex;align-items:center;gap:34px}
  nav.links a{font-size:14px;font-weight:500;color:var(--purple-light);transition:color .2s}
  nav.links a:hover{color:var(--text)}
  .nav-cta{
    font-size:13px;font-weight:700;letter-spacing:.5px;
    padding:10px 20px;border:1px solid var(--purple);border-radius:2px;color:var(--text);
    transition:background .25s,color .25s;
  }
  .nav-cta:hover{background:var(--purple);color:#0A0918}
  .burger{display:none;background:none;border:0;cursor:pointer;color:var(--text)}

  .hero{position:relative;padding:120px 0 130px;overflow:hidden}

    z-index:0;
  }
  .hero .diag2{
    position:absolute;top:0;right:0;width:46%;height:100%;
    border-left:1px solid var(--line-dark);
    clip-path:polygon(28% 0,29% 0,1% 100%,0 100%);
  }
  .hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}

  .hero .sub{margin-top:28px;font-size:clamp(20px,2.4vw,30px);font-weight:300}
  .hero .sub i{font-style:italic;color:var(--purple-light)}
  .hero .amp{color:var(--purple-deep)}
  .hero-cta{margin-top:42px;display:flex;gap:16px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-size:15px;font-weight:700;letter-spacing:.3px;
    padding:15px 28px;border-radius:2px;transition:transform .2s,background .25s,color .25s,border-color .25s;
  }
  .btn-primary{background:var(--purple);color:#0A0918}
  .btn-primary:hover{background:var(--purple-light);transform:translateY(-2px)}
  .btn-ghost{border:1px solid var(--line-dark);color:var(--text)}
  .btn-ghost:hover{border-color:var(--purple);transform:translateY(-2px)}
  .hero-deco{display:flex;justify-content:center;align-items:center}
  .hero-deco .big-icon{filter:drop-shadow(0 20px 50px rgba(102,99,184,.25))}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  section{padding:96px 0;position:relative}

  h2.sec-title{font-weight:800;font-size:clamp(32px,4.4vw,52px);letter-spacing:-1.5px;line-height:1.05;max-width:680px}

  .about-grid p strong{font-weight:700;color:var(--text)}
